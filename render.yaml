services:
  - type: web
    name: horizon-homes-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: QWEN_REALTIME_MODEL
        value: qwen3.5-omni-flash-realtime
      - key: EMAIL_DELIVERY_MODE
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_API_URL
        value: https://api.brevo.com/v3/smtp/email
      - key: BOOKING_FROM_EMAIL
        sync: false
      - key: BOOKING_FROM_NAME
        value: Horizon Homes

  - type: web
    name: horizon-homes-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
